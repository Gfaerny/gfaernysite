name: Build

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Install dependency
        run: |
          sudo apt update
          sudo apt install -y python3

      - name: Run python build script
        run: python3 build.py

      - name: Create archive
        uses: actions/upload-artifact@v4.4.3
        with:
            name: Upload tar.xz
            path: gfaerny.tar.xz          
        
      - name: Create Release
        uses: softprops/action-gh-release@v2.2.0
        with:
          files: gfaernysite.tar.xz

      - name: Cleanup
        run: rm -f gfaernysite.tar.xz
